# Local learning stack; uses new volumes, never migrates an existing Airflow 2 DB.
services:
  airflow:
    build: .
    command: standalone
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW_CONN_JOKES_CONN: "postgresql://airflow:airflow@postgres/jokes"
      AIRFLOW_CONN_SMTP_DEFAULT: ${AIRFLOW_CONN_SMTP_DEFAULT:-}
      EMAIL_FOR_REPORT: ${EMAIL_FOR_REPORT:-}
      ENABLE_EMAIL: ${ENABLE_EMAIL:-false}
    volumes:
      - airflow3-local:/opt/airflow
      - ./dags:/opt/airflow/dags:ro
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: jokes
    volumes:
      - jokes-postgres18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d jokes"]
      interval: 5s
      retries: 10
volumes:
  airflow3-local:
  jokes-postgres18:
